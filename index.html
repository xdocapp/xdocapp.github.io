<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XDOC: Choose Your Platform</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        
        .container {
            width: 80%;
            margin: 40px auto;
        }
        
        .button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            color: #fff;
        }
        
        .web-button {
            background-color: #4CAF50;
        }
        
        .app-button {
            background-color: #03A9F4;
        }
        
        .download-button {
            background-color: #FF9800;
        }
        
        .button:hover {
            opacity: 0.8;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="platform-header"></h2>
        <a href="#" id="web-button" class="button web-button">Continue on Web</a>
        
        <a href="#" id="windows-app-button" class="button app-button">Windows App</a>
        <a href="https://downloads.xdoc.app/windows/xdoc-latest.msix" id="windows-download-button" class="button download-button hidden">Download Windows App</a>
        <a href="https://www.apple.com/macos/app-store/" id="macos-app-button" target="_blank" class="button app-button">macOS App</a>
        <a href="https://play.google.com/store/apps" id="android-app-button" target="_blank" class="button app-button">Android App</a>
        <a href="https://www.apple.com/app-store/" id="ios-app-button" target="_blank" class="button app-button">iOS App</a>
        <script>
            function getDynamicPath() {
                var params = new URLSearchParams(window.location.search);
                var path = params.get('path');
                var entity, channel, id;
                if (path && path.includes('?')) {
                    // Handle nested query in path
                    var [basePath, queryString] = path.split('?');
                    var nestedParams = new URLSearchParams(queryString);
                    entity = nestedParams.get('entity');
                    channel = nestedParams.get('channel');
                    id = nestedParams.get('id');
                    if (basePath && entity && channel && id) {
                        return `${basePath}/${entity}/${channel}/${id}`;
                    }
                } else {
                    // Handle top-level query params
                    entity = params.get('entity');
                    channel = params.get('channel');
                    id = params.get('id');
                    if (path && entity && channel && id) {
                        return `${path}/${entity}/${channel}/${id}`;
                    }
                }
                // fallback to pathname
                var fallbackPath = window.location.pathname;
                if (fallbackPath.startsWith('/')) {
                    fallbackPath = fallbackPath.substring(1);
                }
                return fallbackPath;
            }

            document.getElementById('web-button').onclick = function(e) {
                e.preventDefault();
                var dynamicPath = getDynamicPath();
                console.log('Redirecting to:', 'https://t.web.xdoc.app/' + dynamicPath);
                window.location.href = 'https://t.web.xdoc.app/' + dynamicPath;
            };

            document.getElementById('windows-app-button').onclick = function(e) {
                e.preventDefault();
                var dynamicPath = getDynamicPath();
                var deepLink = 'xdoc://' + dynamicPath;
                console.log('Attempting to open:', deepLink);
                
                // Try to open the app
                window.location.href = deepLink;
                
                // Set a timeout to show download link if app doesn't open
                var timeout = setTimeout(function() {
                    document.getElementById('windows-app-button').classList.add('hidden');
                    document.getElementById('windows-download-button').classList.remove('hidden');
                }, 2000);
                
                // Clear timeout if user leaves the page (app opened successfully)
                window.addEventListener('blur', function() {
                    clearTimeout(timeout);
                });
            };
        </script>
    </div>

    <script>
        // Function to get the user's platform
        function getPlatform() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;

            if (/windows phone/i.test(userAgent)) {
                return "Windows Phone";
            }
            if (/windows/i.test(userAgent)) {
                return "Windows";
            }
            if (/macintosh|mac os x/i.test(userAgent)) {
                return "macOS";
            }
            if (/android/i.test(userAgent)) {
                return "Android";
            }
            if (/iphone|ipad|ipod/i.test(userAgent)) {
                return "iOS";
            }

            return "Unknown";
        }

        // Get the user's platform
        const platform = getPlatform();

        // Show relevant links based on the platform
        const platformHeader = document.getElementById("platform-header");
        const webButton = document.getElementById("web-button");
        const windowsAppButton = document.getElementById("windows-app-button");
        const windowsDownloadButton = document.getElementById("windows-download-button");
        const macosAppButton = document.getElementById("macos-app-button");
        const androidAppButton = document.getElementById("android-app-button");
        const iosAppButton = document.getElementById("ios-app-button");

        switch (platform) {
            case "Windows":
                platformHeader.textContent = "You're using Windows!";
                webButton.classList.remove("hidden");
                windowsAppButton.classList.remove("hidden");
                macosAppButton.classList.add("hidden");
                androidAppButton.classList.add("hidden");
                iosAppButton.classList.add("hidden");
                break;
            case "macOS":
                platformHeader.textContent = "You're using macOS!";
                webButton.classList.remove("hidden");
                windowsAppButton.classList.add("hidden");
                macosAppButton.classList.remove("hidden");
                androidAppButton.classList.add("hidden");
                iosAppButton.classList.add("hidden");
                break;
            case "Android":
                platformHeader.textContent = "You're using Android!";
                webButton.classList.remove("hidden");
                windowsAppButton.classList.add("hidden");
                macosAppButton.classList.add("hidden");
                androidAppButton.classList.remove("hidden");
                iosAppButton.classList.add("hidden");
                break;
            case "iOS":
                platformHeader.textContent = "You're using iOS!";
                webButton.classList.remove("hidden");
                windowsAppButton.classList.add("hidden");
                macosAppButton.classList.add("hidden");
                androidAppButton.classList.add("hidden");
                iosAppButton.classList.remove("hidden");
                break;
            default:
                platformHeader.textContent = "You're using an unknown platform!";
                webButton.classList.remove("hidden");
                windowsAppButton.classList.remove("hidden");
                macosAppButton.classList.remove("hidden");
                androidAppButton.classList.remove("hidden");
                iosAppButton.classList.remove("hidden");
                break;
        }
    </script>
</body>
</html>
